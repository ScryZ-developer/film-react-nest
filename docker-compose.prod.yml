# Compose file for the remote server (pulls images from GHCR, no local build).
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16
    container_name: postgres_container
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - film-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin_container
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '${PGADMIN_PORT}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - film-network
    restart: unless-stopped

  backend:
    image: ghcr.io/scryz-developer/film-react-nest-backend:latest
    container_name: backend_container
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LOGGER_TYPE: ${LOGGER_TYPE:-json}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - film-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/scryz-developer/film-react-nest-frontend:latest
    container_name: frontend_container
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - film-network
    restart: on-failure

  nginx:
    image: ghcr.io/scryz-developer/film-react-nest-nginx:latest
    container_name: nginx_container
    ports:
      - '${NGINX_PORT}:80'
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - film-network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film-network:
    driver: bridge
